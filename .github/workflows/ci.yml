# 持续集成：每次推送到 main 与每个 PR 都跑一遍「版本一致 → 测试 → 构建前校验 → 解包构建」。
#
# 为什么在 CI 里也跑 verify:version 与 prepack:check：
#   - verify:version 防「同一版本号对应两份内容」的历史事故（作者本地改了代码忘了升版本，
#     安装包停在旧构建上，用户装到的和 CHANGELOG 描述的不是一回事）。见
#     .claude/rules/conventions.md 的「更新日志」一节。开发期间往 `## 未发布` 段追加内容
#     不会触发失败，只有已发布版本号对不上才失败。
#   - prepack:check 拦的是「构建成功但装出来是坏的」：asar 被改成 true、关键文件缺失、
#     用户数据目录未被排除、混入其它包管理器的锁文件。这些错误 electron-builder 都不会报。
#
# 为什么用 build:dir 而不是完整 build：完整 build 要装 NSIS 与 winCodeSign，每个 PR 都付
# 这份下载成本不划算；解包构建已能验证配置、文件白名单与依赖收集是否正确。完整安装包在
# release.yml 里出。
#
# 为什么是 windows-latest：打包目标是 Windows（NSIS 安装包 + win-unpacked），
# electron-builder 的 Windows 目标必须在 Windows 上构建。
#
# 另外两个作业（macos-latest / ubuntu-latest）做同一件事，只是换平台：
# electron-builder 的 mac 目标只能在 macOS 上出（需要 hdiutil / codesign），
# Linux 目标需要 fpm / AppImage 工具链。三个作业互不依赖，任何一个失败不影响另外两个 ——
# 平台专属的配置错误应该在那一个平台上暴露，而不是让整条 CI 停下来。

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 只读权限：CI 不需要写回仓库
permissions:
  contents: read

# 同一分支的新推送取消旧运行，避免排队堆积
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段决定，这里不写死版本号。
      # 必须在 setup-node 之前：setup-node 的 cache: pnpm 需要 PATH 上已有 pnpm。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # node-version 与 package.json 的 engines.node（>=22.12.0）对齐，取声明的最低版本：
      # 这样 CI 跑通就等于「声明支持的最低环境确实能用」，而不是只在最新版上能跑。
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，
      # 防止 CI 悄悄装出与提交内容不同的依赖树
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 见文件头：防「同一版本号对应两份内容」
      - name: 校验 VERSION / package.json / CHANGELOG 一致
        run: pnpm run verify:version

      - name: 运行测试
        run: pnpm test

      # 独立成步而不是只依赖 build:dir 内部的同名调用：
      # 失败时能一眼看出是配置问题还是构建问题
      - name: 构建前校验
        run: pnpm run prepack:check

      - name: 构建（仅解包目录，不出安装包）
        run: pnpm run build:dir

    # 可选：网络受限时启用镜像，加速 electron / electron-builder 二进制下载。
    # GitHub 托管运行器访问 GitHub Releases 本身就快，默认不启用；
    # 若改为自建运行器或频繁超时，取消下面两行注释即可。
    # env:
    #   ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

  # macOS 作业与 Windows 作业平行，不 depends_on：
  # 平台专属配置（icns、Info.plist 字段、ad-hoc 签名）坏了应该只让这个作业红，
  # 而不是连 Windows 的结果一起被跳过。
  test-and-build-macos:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 VERSION / package.json / CHANGELOG 一致
        run: pnpm run verify:version

      - name: 运行测试
        run: pnpm test

      # 显式传 --mac：CI 里同时存在三个平台，不能靠「当前操作系统」推断
      # 该校验哪一份图标。
      - name: 构建前校验
        run: node scripts/prepack-check.mjs --mac

      # 只解包、不出 dmg：PR 阶段要验证的是「配置能产出可运行的 .app」，
      # 生成 dmg 还要多跑一遍 hdiutil，每次 PR 都付这份时间不划算。
      # CI 里没有签名证书，identity: "-" 会走 ad-hoc —— 正好验证这条路。
      - name: 构建（仅解包目录）
        run: pnpm run build:mac:dir

      # 解包构建也能暴露 Info.plist 写错这类问题，成本只有一条 plutil。
      # 不写死 dist/mac-arm64：macos-latest 的架构会随 GitHub 的镜像更替变化，
      # 而 run-builder 是按 electron-builder 的默认架构出包的。找 .app 即可。
      - name: 校验 Info.plist 版本字段
        run: |
          app=$(find dist -maxdepth 2 -name '*.app' -type d | head -n 1)
          test -n "$app" || { echo "::error::没找到 .app 产物"; exit 1; }
          plutil -p "$app/Contents/Info.plist" \
            | grep -q "\"CFBundleShortVersionString\" => \"$(cat VERSION)\""
          plutil -p "$app/Contents/Info.plist" \
            | grep -q "\"CFBundleVersion\" => \"$(cat VERSION)\""
          plutil -p "$app/Contents/Info.plist" \
            | grep -q '"CFBundleIconFile" => "icon.icns"'

  # Linux 目标只能在 Linux 上出：AppImage 需要 appimagetool，deb 需要 fpm，
  # 两者都由 electron-builder 在构建时按平台下载，darwin 上跑不起来。
  test-and-build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 VERSION / package.json / CHANGELOG 一致
        run: pnpm run verify:version

      - name: 运行测试
        run: pnpm test

      - name: 构建前校验
        run: node scripts/prepack-check.mjs --linux

      # AppImage 的运行时依赖 fuse 在 ubuntu-latest 上默认不装，但 build:dir
      # 只解包、不生成 AppImage，不需要它 —— 出 AppImage 在 release.yml 里。
      - name: 构建（仅解包目录）
        run: pnpm run build:linux:dir
