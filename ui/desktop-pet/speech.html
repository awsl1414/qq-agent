<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QQ Agent 桌宠回复</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <section id="speech" class="speech" aria-label="桌宠回复" hidden>
    <button id="speech-close" class="speech-close" type="button" aria-label="关闭回复" title="关闭回复（Esc）"><span aria-hidden="true">×</span></button>
    <div id="speech-text" class="speech-text" role="status" aria-live="polite" aria-atomic="true" tabindex="0" aria-label="桌宠完整回复，可选择并复制文字，按 Esc 关闭"></div>
  </section>
  <script type="module" src="speech-window.js"></script>
</body>
</html>
